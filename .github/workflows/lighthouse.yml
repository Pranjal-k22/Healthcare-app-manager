name: Lighthouse CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    name: Production Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Wait for production deployment
        run: |
          for i in {1..20}; do
            if curl --fail --silent --show-error https://www.health-pulse.app/ > /dev/null; then
              echo "Production is reachable"
              exit 0
            fi
            echo "Waiting for production..."
            sleep 15
          done
          exit 1

      - name: Run Lighthouse CI
        working-directory: client
        run: npx lhci autorun --config=../lighthouserc.cjs
